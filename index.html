.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}

.say{background:#fff;border-radius:20px;padding:10px 14px;border:3px solid #3a86ff;text-align:left;font-size:.9em}

.opt.off{opacity:.35;border-style:dashed}.opt.ok{border-color:#2d9c5a;background:#e3f9e5}
.rs{display:flex;flex-direction:column;align-items:center;gap:4px}

.w{background:#fff;border-radius:24px;padding:14px;width:230px;border:5px solid #95d5b2}
.bd{display:inline-block;background:#fff;border-radius:16px;padding:8px 12px;margin:4px;border:3px solid #ffd166}.bd.lk{opacity:.4;filter:grayscale(1)}
table{margin:10px auto;border-collapse:collapse;background:#fff;border-radius:12px;text-align:left}td,th{padding:8px 14px;border-bottom:1px solid #ddd}

yarasa:{n:'Yarasa',c:'#7b5ea7',s:E(50,52,7,14)+C(50,32,8)+P('44,28 43,15 50,26')+P('56,28 57,15 50,26')+F('M43 48Q20 18 3 36Q12 38 14 50Q22 44 28 56Q36 52 43 62Z')+`<g transform="translate(100 0) scale(-1 1)">${F('M43 48Q20 18 3 36Q12 38 14 50Q22 44 28 56Q36 52 43 62Z')}</g>`,hl:[50,42,32],h2:'Bu hayvanın deriden geniş kanatları ve sivri kulakları var.',h3:'Bu hayvan geceleri uçar.',r:'Çünkü kanatları geniş ve sivri.'},

const W1=['tavsan','kedi','kopek','balik','kus','fil','zurafa','kelebek','kaplumbaga','maymun'],W2=['semsiye','anahtar','makas','bardak','top','sandalye','cekic','saat'];

3:[['tavsan','fare','kedi'],['kedi','kopek','fare'],['kopek','kedi','maymun'],['kus','kelebek','yarasa'],['kelebek','kus','yarasa'],['top','saat','bardak'],['anahtar','cekic','makas'],['fil','zurafa','kaplumbaga']].map(o=>({a:o[0],o}))};
const WN={1:['Ormanın Hayvanları','hayvana'],2:['Gizemli Nesneler','nesneye'],3:['Benzer Gölgelerin Gizemi','şeye']};
const BADGES=[['Dikkatli Gözlemci','İlk denemede 5 doğru',s=>s.f>=5],['İpucu Avcısı','İpuçlarını 3 kez kullandı',s=>s.h+s.r>=3],['Gölge Uzmanı','Dünya 1 tamam',s=>s.d[1]],['Mantık Dedektifi','5 gerekçe seçti',s=>s.ro>=5],['Büyük Dedektif','Üç dünya tamam',s=>s.d[1]&&s.d[2]&&s.d[3]]];
const GOOD=['Harika dedektif! Doğru hayvanı ya da nesneyi buldun.','Süper! İpuçlarını çok iyi kullandın.','Bravo! Dikkatle baktığın için buldun.'];
const SOFT=['Güzel bir tahmin! Bir ipucuna daha bakalım.','Olabilir ama başka bir ipucu var. Birlikte bakalım.','İyi denedin! Gölgeyi yeniden inceleyelim.'];
const DET=`<svg viewBox="0 0 80 92" aria-hidden="true"><rect x="20" y="72" width="40" height="18" rx="8" fill="#3a6ea5"/><circle cx="40" cy="52" r="22" fill="#ffd8b5"/><ellipse cx="40" cy="34" rx="31" ry="6" fill="#7b4b2a"/><rect x="22" y="12" width="36" height="22" rx="9" fill="#8d5a34"/><circle cx="32" cy="52" r="2.6" fill="#333"/><circle cx="48" cy="52" r="2.6" fill="#333"/><path d="M32 62Q40 69 48 62" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="62" cy="66" r="10" fill="#fff8" stroke="#555" stroke-width="3"/><path d="M69 74L78 87" stroke="#555" stroke-width="4" stroke-linecap="round"/></svg>`;
/* ===== DURUM ===== */
const KEY='gizemliGolgeDedektifleri_v1';
const fresh=()=>({t:0,f:0,h:0,r:0,ro:0,rt:0,d:{1:false,2:false,3:false},snd:true});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let G=null,cur='';
const $=s=>document.querySelector(s),pick1=a=>a[Math.random()*a.length|0];
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* ===== SES ===== */
let ac;function tone(f,t=0){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.16)}catch(e){}}
function speak(t){if(!S.snd||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function snd(){S.snd=!S.snd;save();if(!S.snd)try{speechSynthesis.cancel()}catch(e){}view()}
const sb=()=>`<button class="btn s" onclick="snd()" aria-label="Sesi aç veya kapat">Ses: ${S.snd?'Açık':'Kapalı'}</button>`;

function sv(id,m,ring){const it=I[id];let vb='0 0 100 100';if(m==='z'){const[x,y,r]=it.hl;vb=`${x-r} ${y-r} ${2*r} ${2*r}`}
const rg=ring?`<circle class="ring" cx="${it.hl[0]}" cy="${it.hl[1]}" r="${it.hl[2]}" fill="none" stroke="#ff9f1c" stroke-width="2.5" stroke-dasharray="5 4"/>`:'';
return`<svg viewBox="${vb}" class="${m==='c'?'':'sh'}" role="img" aria-label="${m==='c'?it.n:'Gölge'}">${it.s.replaceAll('@',it.c)}${rg}</svg>`}
function go(h){$('#app').innerHTML=h;scrollTo(0,0)}

/* ===== EKRANLAR ===== */
function view(){({welcome,menu,worlds,game,teacher}[cur]||welcome)()}
function welcome(){cur='welcome';go(`<div class="top"><span></span>${sb()}</div><h1>Gizemli Gölge Dedektifleri</h1><div style="width:140px;margin:auto">${DET}</div><p class="q">Merhaba küçük dedektif!<br>Ormandaki hayvanların gölgeleri birbirine karıştı. Bize yardım eder misin?</p><p class="note">İyi bir dedektif acele etmez. Dikkatlice inceler, ipuçlarını kullanır ve tahminini gerektiğinde değiştirir.</p><button class="btn g" onclick="menu();speak('Haydi gölgeyi inceleyelim!')">Başla</button>`);}
function menu(){cur='menu';go(`<div class="top"><span></span>${sb()}</div><h1>Ana Menü</h1><div style="width:110px;margin:auto">${DET}</div><button class="btn g" onclick="worlds()">Oyuna Başla</button><br><button class="btn b" onclick="teacher()">Öğretmen Paneli</button><br><button class="btn s" onclick="resetAll()">Baştan Başla</button>`)}
function worlds(){cur='worlds';go(`<div class="top"><button class="btn s" onclick="menu()">Ana Menü</button>${sb()}</div><h2>Bir dünya seç</h2><div class="wrow">${[1,2,3].map(w=>`<div class="w"><h2>Dünya ${w}</h2><b>${WN[w][0]}</b><div style="margin:8px">${sv(QS[w][0].a,'c')}</div><div>${QS[w].length} soru ${S.d[w]?'· Tamamlandı ✓':''}</div><button class="btn g" onclick="start(${w})">Oyna</button></div>`).join('')}</div><h2>Rozetlerim</h2>${bd()}`)}
function start(w){const qs=sh(QS[w]).map(q=>({...q,o:sh(q.o||[q.a,...sh(q.p.filter(x=>x!==q.a)).slice(0,2)])}));
G={w,qs,i:0};qn();cur='game';game();speak('Sence bu hangi '+(w===2?'nesne':'hayvan')+'?')}
function qn(){G.i=G.i||0;Object.assign(G,{stage:0,wrong:[],lock:false,zoom:false,used:false,done:false,rs:null,rdone:false,rcount:false,msg:'Gölgeyi dikkatle incele. Sence bu ne?',off:[]})}
function game(){const q=G.qs[G.i],it=I[q.a];cur='game';
const opts=G.rs?`<div class="rs"><p class="q">Neden ${it.n.toLowerCase()} seçtin?</p>${G.rs.map((r,k)=>`<button class="btn ${G.rdone&&r===it.r?'ok':''}" onclick="rsPick(${k})" ${G.rdone?'disabled':''}>${r}</button>`).join('')}${G.rdone?`<button class="btn g" onclick="next()">${G.i+1>=G.qs.length?'Bölümü bitir':'Devam'}</button>`:''}</div>`:
`<div class="opts">${q.o.map((id,k)=>`<button class="opt ${G.off.includes(id)?'off':''}" onclick="pick('${id}')" ${G.off.includes(id)||G.lock?'disabled':''} aria-label="${k+1}. seçenek ${I[id].n}">${sv(id,'c')}${k+1}. ${I[id].n}</button>`).join('')}</div>
<div><button class="btn b" onclick="hint()" ${G.lock?'disabled':''}>İpucu</button><button class="btn b" onclick="lens()" ${G.lock?'disabled':''}>Dedektif Merceği</button>${G.lock?`<button class="btn g" onclick="rethink()">Tahminimi değiştiriyorum</button>`:''}</div>`;
go(`<div class="top"><button class="btn s" onclick="home()">Ana Menü</button><span class="prog">Dünya ${G.w} · ${G.i+1} / ${G.qs.length}</span>${sb()}</div>
<div class="stage"><div class="card">${G.rdone||G.rs?sv(q.a,'c'):sv(q.a,G.zoom?'z':'s',G.stage>0&&!G.zoom)}</div><div class="det">${DET}<div class="say" aria-live="polite">${G.msg}</div></div></div>
<p class="q">Bu gölge hangi ${WN[G.w][1]==='şeye'?'canlıya ya da nesneye':WN[G.w][1]} ait?</p>${opts}`)}
function home(){if(confirm('Ana menüye dönmek istiyor musun? İlerlemen kaydedildi.'))menu()}
function say(m){G.msg=m;speak(m)}
function hint(){if(G.done)return;G.used=true;G.stage=Math.min(G.stage+1,2);const q=G.qs[G.i],it=I[q.a];say(G.stage===1?(q.h2||it.h2):(q.h3||it.h3));game()}
function lens(){if(G.done)return;G.used=true;G.zoom=!G.zoom;say(G.zoom?'Mercekle gölgenin önemli bir parçasına baktın. Ne görüyorsun?':'Gölgenin tamamına yeniden bak.');game()}
function rethink(){G.lock=false;say('Tahminini yeniden düşünebilirsin.');game()}
function pick(id){if(G.lock||G.done)return;const q=G.qs[G.i],it=I[q.a];
if(id===q.a){G.done=true;S.t++;const k=G.wrong.length?'r':G.used?'h':'f';S[k]++;save();tone(523);tone(659,.15);tone(784,.3);
const pool=Object.keys(I).filter(x=>!q.o.includes(x)).map(x=>I[x].r).filter((v,i,a)=>a.indexOf(v)===i&&v!==it.r);
G.rs=sh([it.r,...sh(pool).slice(0,2)]);G.zoom=false;G.msg=pick1(GOOD)+' Şimdi seçimini açıklayalım.';speak(G.msg);game()}
else{G.wrong.push(id);G.off.push(id);G.stage=Math.min(G.stage+1,2);G.lock=true;tone(330);G.zoom=false;
say(pick1(SOFT)+' '+(G.stage===1?(q.h2||it.h2):(q.h3||it.h3)));game()}}
function rsPick(k){if(G.rdone)return;const it=I[G.qs[G.i].a];if(!G.rcount){G.rcount=true;S.rt++;G.first=true}else G.first=false;
if(G.rs[k]===it.r){if(G.first)S.ro++;G.rdone=true;save();tone(660);say('Harika! İpuçlarını çok iyi kullandın.')}else{tone(330);say('Güzel düşündün! Bir daha bakalım, hangisi gölgeye uyuyor?')}game()}
function next(){G.i++;if(G.i>=G.qs.length)return done();qn();game();speak('Sence bu ne?')}
function done(){const w=G.w;S.d[w]=true;save();const all=S.d[1]&&S.d[2]&&S.d[3];cur='done';
go(`<h1>${all?'Büyük Dedektif Oldun!':'Bölüm Tamam!'}</h1><div style="width:130px;margin:auto">${DET}</div><p class="q">Harika çalıştın! İpuçlarını inceleyerek yeni şeyler öğrendin.</p>${bd()}<div>${w<3?`<button class="btn g" onclick="start(${w+1})">Sonraki dünya</button>`:''}<button class="btn b" onclick="worlds()">Dünyalar</button>${all?`<button class="btn" onclick="teacher()">Öğretmen paneli</button>`:''}<button class="btn s" onclick="menu()">Ana Menü</button></div>`);speak('Harika çalıştın! İpuçlarını inceleyerek yeni şeyler öğrendin.')}
function teacher(){cur='teacher';const n=Object.keys(S.d).filter(k=>S.d[k]).length;
go(`<div class="top"><button class="btn s" onclick="menu()">Ana Menü</button>${sb()}</div><h2>Öğretmen Paneli</h2><table><tr><td>Oynanan soru sayısı</td><td><b>${S.t}</b></td></tr><tr><td>İlk denemede doğru</td><td><b>${S.f}</b></td></tr><tr><td>İpucu kullanarak çözülen</td><td><b>${S.h}</b></td></tr><tr><td>Tahminini gözden geçirip çözülen</td><td><b>${S.r}</b></td></tr><tr><td>Gerekçeyi ilk seçişte doğru</td><td><b>${S.ro} / ${S.rt}</b></td></tr><tr><td>Tamamlanan dünyalar</td><td><b>${n} / 3</b> (${[1,2,3].map(w=>`D${w}: ${S.d[w]?'✓':'–'}`).join(', ')})</td></tr></table>
<p class="note">İpucu kullanmak ve tahmini değiştirmek olumlu öğrenme davranışlarıdır. Bu veriler tek başına çocuğun bilişsel yeterliliği için kesin yargı oluşturmaz; yalnızca gözlemlerinizi desteklemek içindir. Veriler yalnızca bu cihazın tarayıcısında saklanır, hiçbir yere gönderilmez.</p><button class="btn b" onclick="worlds()">Dünyalara git</button><button class="btn s" onclick="resetAll()">Verileri sıfırla</button>`)}
function resetAll(){if(confirm('Tüm ilerleme ve sonuçlar silinecek. Emin misin?')){const s=S.snd;S=fresh();S.snd=s;save();menu()}}
document.addEventListener('keydown',e=>{if(cur==='game'&&G&&!G.rs&&['1','2','3'].includes(e.key)){const id=G.qs[G.i].o[e.key-1];if(id&&!G.off.includes(id))pick(id)}});
welcome();
</script></body></html>
