<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Okul Öncesi Oyunlar</title>
<style>
:root{
  --sky:#cdeefc;--sky2:#e8f7ff;--grass:#bfe3a8;--ink:#33425e;
  --coral:#ef6f6c;--coral-d:#c9514e;
  --teal:#4fb6a8;--teal-d:#2f8f83;
  --sun:#f2b632;--sun-d:#c4901d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;color:var(--ink);
  background:linear-gradient(var(--sky) 0%,var(--sky2) 55%,var(--grass) 55.1%,var(--grass) 100%) fixed;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:max(28px,env(safe-area-inset-top)) 20px max(36px,env(safe-area-inset-bottom));
}
h1{margin:8px 0 6px;font-size:clamp(40px,8vw,84px);line-height:1.05;text-align:center}
.sub{margin:0 0 clamp(24px,5vw,48px);font-size:clamp(20px,3.2vw,32px);text-align:center}
.games{
  list-style:none;margin:0;padding:0;width:100%;max-width:1100px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(18px,3vw,34px);
}
.game{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:clamp(220px,32vw,340px);padding:24px 18px;text-decoration:none;color:#fff;text-align:center;
  border-radius:44px;background:var(--c);box-shadow:0 14px 0 var(--d);
  transition:transform .15s,box-shadow .15s;
}
.game:hover{transform:translateY(-4px)}
.game:active{transform:translateY(10px);box-shadow:0 4px 0 var(--d)}
.game:focus-visible{outline:6px solid var(--ink);outline-offset:6px}
.emoji{font-size:clamp(84px,14vw,140px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15))}
.name{font-size:clamp(28px,4.4vw,44px);line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.play{
  margin-top:6px;padding:8px 30px;border-radius:40px;background:#fff;color:var(--ink);font-size:clamp(22px,3vw,30px);
}
.g1{--c:var(--coral);--d:var(--coral-d)}
.g2{--c:var(--teal);--d:var(--teal-d)}
.g3{--c:var(--sun);--d:var(--sun-d)}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
  <h1>Oyun zamanı!</h1>
  <p class="sub">Bir oyun seç ve başla.</p>

  <ul class="games">
    <li><a class="game g1" href="kasiftreni/">
      <span class="emoji" aria-hidden="true">🚂</span>
      <span class="name">Minik Kaşif Treni</span>
      <span class="play">Oyna</span>
    </a></li>
    <li><a class="game g2" href="minikdedektif/">
      <span class="emoji" aria-hidden="true">🔍</span>
      <span class="name">Minik Dedektif</span>
      <span class="play">Oyna</span>
    </a></li>
    <li><a class="game g3" href="sihirliayna/">
      <span class="emoji" aria-hidden="true">🪞</span>
      <span class="name">Sihirli Ayna</span>
      <span class="play">Oyna</span>
    </a></li>
  </ul>
</body>
</html>
