<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gölgenin Kayıp Parçası</title>
<style>
:root{
  --ink:#24305e;
  --paper:#fff8e3;
  --sky:#e8f1ff;
  --teal:#13a89e;
  --teal-d:#0c7f77;
  --sun:#ffc933;
  --sun-d:#e5a800;
  --coral:#ff7a59;
  --coral-d:#d9553a;
  --lilac:#8f7cf0;
  --good:#2fb36b;
  --scene:300px;
  --font:"Trebuchet MS","Segoe UI","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:var(--font);color:var(--ink);overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--lilac);outline-offset:3px}

/* ---------- genel ekran düzeni ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));overflow:auto;touch-action:pan-y}
.screen.active{display:flex}
#screen-game{justify-content:flex-start;overflow:hidden;touch-action:none;padding:8px 10px max(8px,env(safe-area-inset-bottom))}
.bg-dots{background:
  radial-gradient(circle at 12% 18%,rgba(255,201,51,.28) 0 60px,transparent 61px),
  radial-gradient(circle at 88% 82%,rgba(19,168,158,.2) 0 90px,transparent 91px),
  var(--sky)}

.btn{border:0;border-radius:26px;font-weight:800;letter-spacing:.2px;padding:16px 28px;font-size:clamp(18px,3.4vw,26px);box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s;min-height:64px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-main{background:var(--sun);color:var(--ink);box-shadow:0 8px 0 var(--sun-d)}
.btn-main:active{box-shadow:0 3px 0 var(--sun-d)}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 7px 0 var(--teal-d)}
.btn-teal:active{box-shadow:0 2px 0 var(--teal-d)}
.btn-soft{background:#fff;color:var(--ink);box-shadow:0 7px 0 #c9d3ee}

/* ---------- ana menü ---------- */
.menu-card{background:var(--paper);border:6px solid var(--ink);border-radius:36px;padding:clamp(18px,4vw,40px);max-width:760px;width:100%;text-align:center;box-shadow:0 12px 0 rgba(36,48,94,.25);position:relative}
.menu-badge{width:clamp(96px,22vw,150px);height:auto;display:block;margin:-70px auto 6px;filter:drop-shadow(0 6px 0 rgba(36,48,94,.25))}
.menu-card h1{margin:6px 0 0;font-size:clamp(32px,7.5vw,64px);line-height:1.02;letter-spacing:1px;color:var(--ink)}
.menu-card h2{margin:6px 0 14px;font-size:clamp(20px,4.5vw,36px);color:var(--teal-d)}
.menu-card p{margin:0 auto 22px;font-size:clamp(17px,3vw,24px);max-width:560px;line-height:1.35}
.menu-levels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;font-size:clamp(14px,2.4vw,18px);font-weight:700}
.menu-levels span{background:#fff;border-radius:999px;padding:7px 14px;border:3px solid var(--ink)}

/* ---------- üst çubuk ---------- */
.topbar{width:100%;max-width:980px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.iconbtn{width:52px;height:52px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-size:26px;display:grid;place-items:center;padding:0;flex:0 0 auto;box-shadow:0 4px 0 rgba(36,48,94,.25)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,48,94,.25)}
.levelpill{flex:1 1 auto;min-width:0;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:5px 10px;font-weight:800;font-size:clamp(13px,2.6vw,20px);line-height:1.15}
.levelpill small{display:block;font-size:.78em;color:var(--teal-d)}
.starcount{background:var(--sun);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;font-weight:900;font-size:clamp(16px,3vw,22px);flex:0 0 auto;white-space:nowrap}
.progress{width:100%;max-width:980px;display:flex;align-items:center;gap:10px;margin:6px 0 4px;flex:0 0 auto;justify-content:center}
.progress .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;font-size:clamp(15px,3.2vw,22px)}
.progress .txt{font-weight:800;font-size:clamp(13px,2.6vw,18px);white-space:nowrap}
.dot{opacity:.45;filter:grayscale(1)}
.dot.done{opacity:1;filter:none}
.dot.now{opacity:1;filter:none;transform:scale(1.25)}

/* ---------- soru balonu ---------- */
.speech{width:100%;max-width:980px;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:8px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto;box-shadow:0 5px 0 rgba(36,48,94,.2);min-height:60px}
.speech .msg{flex:1;font-size:clamp(17px,3.4vw,28px);font-weight:800;line-height:1.15;text-align:center}
.speech .msg.hintmsg{color:var(--coral-d)}
.speech .msg.softmsg{color:var(--teal-d)}
.speech .msg.goodmsg{color:var(--good)}

/* ---------- sahne ---------- */
.stage{width:100%;max-width:980px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:6px;position:relative}
.scene-row{display:flex;gap:clamp(8px,3vw,36px);justify-content:center;align-items:flex-start;width:100%}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:26px;padding:8px;display:flex;flex-direction:column;align-items:center;box-shadow:0 7px 0 rgba(36,48,94,.22);position:relative}
.card .cap{font-weight:900;font-size:clamp(14px,2.6vw,20px);margin-bottom:2px;display:flex;align-items:center;gap:6px}
.card.shadowcard{background:#dfe6ff}
.card svg.scene{width:var(--scene);height:var(--scene);display:block;touch-action:none;overflow:visible}
.card.glow{animation:glow .9s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,201,51,.9)}100%{box-shadow:0 0 0 38px rgba(255,201,51,0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.hole{animation:holepulse 1.4s ease-in-out infinite}
@keyframes holepulse{0%,100%{opacity:.95}50%{opacity:.55}}

/* parça tepsisi */
.tray{display:flex;gap:clamp(5px,2.2vw,24px);justify-content:center;align-items:stretch;width:100%}
.slot{background:var(--paper);border:4px dashed var(--ink);border-radius:20px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;flex:0 1 auto;position:relative}
.slot .lab{font-weight:900;font-size:clamp(12px,2.4vw,17px);margin-bottom:2px}
.slot .cell{display:grid;place-items:center;position:relative}
.piece{position:relative;cursor:grab;touch-action:none;z-index:2;filter:drop-shadow(0 5px 0 rgba(36,48,94,.25));transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.piece.dragging{transition:none;cursor:grabbing;z-index:50;filter:drop-shadow(0 12px 6px rgba(36,48,94,.3))}
.piece.back{transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.piece.shake{animation:shake .4s}
.piece.used{opacity:.25;pointer-events:none}
@keyframes shake{0%,100%{rotate:0deg}25%{rotate:-7deg}75%{rotate:7deg}}
.piece svg{display:block;overflow:visible;pointer-events:none}
.slot.pickable{cursor:pointer}
.slot.pickable:active{transform:scale(.97)}
.slot.chosen{border-style:solid;border-color:var(--teal);background:#e6fbf7}
.slot.wrongshake{animation:shake .4s}
.slot.chosen.good{border-color:var(--good);background:#e5ffe9}

/* seçenek butonları (doğru/yanlış, kanıt) */


/* alt çubuk */
.bottombar{width:100%;max-width:980px;display:flex;justify-content:center;gap:12px;flex:0 0 auto;padding-top:4px}
.hintbtn{background:#e3e7f5;color:#8c94b5;box-shadow:0 5px 0 #c4cbe3;min-height:56px;padding:10px 22px;font-size:clamp(16px,3vw,22px)}
.hintbtn.ready{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-d);animation:pulse 1.2s ease-in-out infinite}
.hintbtn:disabled{cursor:default}

/* efektler */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.spark{position:absolute;font-size:28px;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(160deg);opacity:0}}

/* ödül / son ekranlar */
.reward{background:var(--paper);border:6px solid var(--ink);border-radius:36px;padding:clamp(18px,4vw,36px);max-width:680px;width:100%;text-align:center;box-shadow:0 12px 0 rgba(36,48,94,.25)}
.reward .big{font-size:clamp(56px,min(18vw,15vh),130px);line-height:1;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.reward h2{margin:8px 0;font-size:clamp(26px,6vw,46px)}
.reward p{font-size:clamp(17px,3.2vw,26px);margin:8px 0 20px;line-height:1.3}
.reward .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.reward .stars{font-size:clamp(22px,min(5vw,5vh),40px);margin:4px 0;line-height:1.2}


.card svg.scene.objbig{width:var(--obj);height:var(--obj)}
.slot.pickable{border-style:solid;background:#dfe6ff;transition:transform .7s cubic-bezier(.3,1.2,.5,1),opacity .4s}
.slot.pickable svg.scene{width:var(--scene);height:var(--scene)}
.wobble{animation:shake .4s}
@media (prefers-reduced-motion:reduce){
  .hole,.hintbtn.ready,.card.glow,.wobble{animation:none}
}
</style>
</head>
<body>

<!-- ============ ANA MENÜ ============ -->
<section id="screen-menu" class="screen bg-dots active">
  <div class="menu-card">
    <svg class="menu-badge" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="54" fill="#ffc933" stroke="#24305e" stroke-width="6"/>
      <circle cx="52" cy="52" r="24" fill="#e8f1ff" stroke="#24305e" stroke-width="7"/>
      <path d="M70 70 L96 96" stroke="#24305e" stroke-width="12" stroke-linecap="round"/>
      <path d="M40 58 Q52 40 66 50" stroke="#13a89e" stroke-width="5" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>🌑 GÖLGENİN KAYIP PARÇASI</h1>
    <p>Gölgeyi dikkatlice incele, doğru parçayı bul!</p>
    <button id="btn-start" class="btn btn-main">▶ OYUNA BAŞLA</button>
  </div>
</section>

<!-- ============ OYUN ============ -->
<section id="screen-game" class="screen bg-dots">
  <div class="topbar">
    <button class="iconbtn" id="btn-home" aria-label="Ana menü">🏠</button>
    <div class="levelpill" id="levelpill"></div>
    <button class="iconbtn" id="btn-voice" aria-label="Sesi aç veya kapat">🔊</button>
    <div class="starcount" id="starcount">⭐ 0</div>
  </div>

  <div class="speech">
    <button class="iconbtn" id="btn-repeat" aria-label="Yönergeyi tekrar dinle" style="width:46px;height:46px;font-size:22px">🔈</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bottombar">
    <button class="btn hintbtn" id="btn-hint" disabled>💡 İPUCU</button>
  </div>
</section>

<!-- ============ DÜZEY BİTTİ ============ -->
<section id="screen-level" class="screen bg-dots">
  <div class="reward">
    <div class="big">🔍</div>
    <h2>KAŞİF ROZETİ</h2>
    <div class="stars" id="level-stars"></div>
    <p id="level-text"></p>
    <div class="row"><button class="btn btn-main" id="btn-nextlevel">▶ SONRAKİ AŞAMA</button></div>
  </div>
</section>

<!-- ============ OYUN SONU ============ -->
<section id="screen-end" class="screen bg-dots">
  <div class="reward">
    <div class="big">🏆</div>
    <h2>GÖLGE KAŞİFİ</h2>
    <h2 style="color:var(--teal-d)">🌟 TEBRİKLER!</h2>
    <div class="stars" id="end-stars"></div>
    <p>Gölgenin kayıp parçalarını buldun!<br>Sen harika bir gölge kaşifisin!</p>
    <div class="row">
      <button class="btn btn-main" id="btn-replay">🔄 Tekrar Oyna</button>
      <button class="btn btn-teal" id="btn-menu">🏠 Ana Menü</button>
    </div>
  </div>
</section>

<div class="sparkles" id="sparkles" aria-hidden="true"></div>

   ---------------------------------------------------------------------
   1) ÇİZİM KÜTÜPHANESİ (OBJECTS): her nesne 200x200'lük bir alanda,
      parçalardan oluşur. Parça = { id, d (SVG path), c (renk), x (ekstra süs) }
   2) GÖREV VERİ TABANI (TASKS): yeni görev eklemek için diziye yeni bir
      kayıt eklemek yeterlidir (açıklamalar TASKS'ın üstünde).

let audioCtx=null;
function tone(freqs,dur=.14,type="sine",vol=.12){
  if(!state.voiceOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    let t=audioCtx.currentTime;
    freqs.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0,t+i*dur);g.gain.linearRampToValueAtTime(vol,t+i*dur+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur+.12);
      o.start(t+i*dur);o.stop(t+i*dur+dur+.15);
    });
  }catch(e){}
}
const sfx={
  good:()=>tone([660,880,1100],.1),
  soft:()=>tone([330,294],.12,"triangle",.09),
  snap:()=>tone([520,780],.07,"sine",.12),
  star:()=>tone([880,1175,1568],.09),
  pick:()=>tone([500],.06,"sine",.07)
};
let trVoice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  trVoice=vs.find(v=>/^tr/i.test(v.lang)&&/female|kadın|yelda|filiz|seda/i.test(v.name))||vs.find(v=>/^tr/i.test(v.lang))||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopSpeech(){try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
function speak(text){
  currentSpeech=text;
  if(!state.voiceOn||!("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="tr-TR";if(trVoice)u.voice=trVoice;
    u.rate=.92;u.pitch=1.2;u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- SVG oluşturma ---------- */
function partsOf(key){return OBJECTS[key].parts}
function getPart(key,id){return partsOf(key).find(p=>p.id===id)}
function pathEl(d,fill,extra={}){
  const p=document.createElementNS(SVGNS,"path");
  p.setAttribute("d",d);p.setAttribute("fill",fill);
  for(const k in extra)p.setAttribute(k,extra[k]);
  return p;
}
function colorPartGroup(part,deco=true){
  const g=document.createElementNS(SVGNS,"g");
  g.appendChild(pathEl(part.d,part.c,{stroke:"rgba(36,48,94,.55)","stroke-width":2.5,"stroke-linejoin":"round"}));
  if(deco&&part.x)part.x.forEach(x=>{ if(x.c!=="none")g.appendChild(pathEl(x.d,x.c)) });
  return g;
}
function mirrorTf(){return "translate(200,0) scale(-1,1)"}

/* tam renkli nesne */
function buildObjectSVG(key,mirror){
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("viewBox","0 0 200 200");svg.classList.add("scene");
  const g=document.createElementNS(SVGNS,"g");
  if(mirror)g.setAttribute("transform",mirrorTf());
  partsOf(key).forEach(p=>g.appendChild(colorPartGroup(p)));
  svg.appendChild(g);
  return svg;
}
/* gölge: tek renk, belirgin dış hat; omit -> boşluk; swap -> şekil değişir */
const SHADOW_COLOR="#2c3a73";
function buildShadowSVG(def){
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("viewBox","0 0 200 200");svg.classList.add("scene");
  const g=document.createElementNS(SVGNS,"g");
  if(def.mirror)g.setAttribute("transform",mirrorTf());
  let holeEl=null;
  partsOf(def.object).forEach(p=>{
    if(def.drop&&def.drop.includes(p.id))return;
    const d=(def.swap&&def.swap[p.id])?def.swap[p.id]:p.d;
    if(def.omit===p.id){
      holeEl=pathEl(d,"rgba(255,255,255,.9)",{stroke:"#ff7a59","stroke-width":4,"stroke-dasharray":"8 6","stroke-linejoin":"round",class:"hole"});
      g.appendChild(holeEl);
    }else{
      g.appendChild(pathEl(d,SHADOW_COLOR,{stroke:SHADOW_COLOR,"stroke-width":3,"stroke-linejoin":"round"}));
    }
  });
  svg.appendChild(g);
  svg._hole=holeEl;svg._def=def;svg._g=g;
  return svg;
}
/* boşluğu doldur (doğru parça yerleştiğinde gölge tamamlanır) */
function fillHole(shadowSvg){
  const h=shadowSvg._hole;if(!h)return;
  h.removeAttribute("class");
  h.setAttribute("fill",SHADOW_COLOR);h.setAttribute("stroke",SHADOW_COLOR);h.removeAttribute("stroke-dasharray");
  h.setAttribute("stroke-width",3);
}

/* ---------- parça seçeneklerinin çizimi ---------- */
/* Parça, gölgedeki boşlukla AYNI ölçekte ve koordinatta çizilir; bu sayede
   doğru parça tam oturur. Ekran piksel ölçeği = sahne boyutu / 200. */
function optionTransform(opt,cx,cy){
  switch(opt.kind){
    case "mirror": return `translate(${cx},0) scale(-1,1) translate(${-cx},0)`;
    case "flipV":  return `translate(0,${cy}) scale(1,-1) translate(0,${-cy})`;
    case "rotate": return `rotate(${opt.deg} ${cx} ${cy})`;
    case "stretch":return `translate(${cx},${cy}) scale(${opt.sx},${opt.sy}) translate(${-cx},${-cy})`;
    default: return "";
  }
}
let measureSvg=null;
function bboxOf(builderFn){
  if(!measureSvg){
    measureSvg=document.createElementNS(SVGNS,"svg");
    measureSvg.setAttribute("width","0");measureSvg.setAttribute("height","0");
    measureSvg.style.cssText="position:absolute;left:-9999px;top:-9999px;visibility:hidden";
    document.body.appendChild(measureSvg);
  }
  const g=document.createElementNS(SVGNS,"g");
  builderFn(g);measureSvg.appendChild(g);
  const b=g.getBBox();measureSvg.removeChild(g);
  return {x:b.x,y:b.y,w:b.width,h:b.height};
}
/* Bir parça seçeneği için { svg, w, h, cx, cy } üretir.
   shadowDef.mirror varsa doğru parça da gölgenin yönüne göre çizilir. */
function buildPieceSVG(task,opt,shadowDef){
  let part=getPart(task.shadowImage.object,task.missingPart);
  if(opt.kind==="other")part=getPart(task.shadowImage.object,opt.part);
  const holePart=getPart(task.shadowImage.object,task.missingPart);
  const hb0=bboxOf(g=>g.appendChild(pathEl(holePart.d,"#000")));
  let cx=hb0.x+hb0.w/2,cy=hb0.y+hb0.h/2;
  const tf=[];
  if(shadowDef.mirror)tf.push(mirrorTf());              // gölge yönü
  const baseTf=tf.join(" ");
  // seçeneğe özel dönüşüm: boşluğun gölgedeki merkezine göre uygulanır
  const holeBox=bboxOf(g=>{const q=pathEl(holePart.d,"#000");if(baseTf)q.setAttribute("transform",baseTf);g.appendChild(q)});
  const hcx=holeBox.x+holeBox.w/2,hcy=holeBox.y+holeBox.h/2;
  const pcxy=(opt.kind==="other")?(()=>{const b=bboxOf(g=>{const q=pathEl(part.d,"#000");if(baseTf)q.setAttribute("transform",baseTf);g.appendChild(q)});return [b.x+b.w/2,b.y+b.h/2]})():[hcx,hcy];
  const ot=optionTransform(opt,pcxy[0],pcxy[1]);
  const fullTf=(ot+" "+baseTf).trim();
  const build=g=>{
    const inner=colorPartGroup(part);
    if(fullTf)inner.setAttribute("transform",fullTf);
    g.appendChild(inner);
  };
  const box=bboxOf(build);
  const pad=6;
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("viewBox",`${box.x-pad} ${box.y-pad} ${box.w+2*pad} ${box.h+2*pad}`);
  const g=document.createElementNS(SVGNS,"g");build(g);svg.appendChild(g);
  return {svg,w:box.w+2*pad,h:box.h+2*pad,
          // parça merkezinin, boşluk merkezinden farkı (doğru yerleşim için gerekli)
          cx:box.x+box.w/2,cy:box.y+box.h/2,hcx,hcy};
}

function computeScene(){
  const vw=window.innerWidth,vh=window.innerHeight,t=currentTask();
  let s,o=0;
  if(t.type==="pickShadow"){s=Math.min(vw*.27,vh*.22,220);o=Math.min(vw*.42,vh*.27,280)}
  else if(t.showObject===false){s=Math.min(vw*.6,vh*.3,320)}
  else{s=Math.min(vw*.4,vh*.3,300)}
  s=Math.max(96,Math.floor(s));
  document.documentElement.style.setProperty("--scene",s+"px");
  document.documentElement.style.setProperty("--obj",Math.floor(o||s)+"px");
  return s;
}

const hintBtn=$("#btn-hint");
function setHintReady(on){
  hintBtn.disabled=!on;
  hintBtn.classList.toggle("ready",on);
}
function armHintTimer(){
  clearTimeout(state.hintReadyTimer);
  setHintReady(false);
  state.hintReadyTimer=setTimeout(()=>setHintReady(true),11000);
}
function noteStruggle(){
  state.attempts++;
  if(state.attempts>=2)setHintReady(true);
}
const GENERIC_HINTS=["Dış hatlara dikkatlice bak.","Parçanın şekline dikkat et.","Eksik parçanın yönünü incele.","Sağ ve sol tarafları karşılaştır."];
hintBtn.addEventListener("click",()=>{
  if(hintBtn.disabled||state.locked)return;
  const t=currentTask();
  const list=(t.hint||[]).concat(GENERIC_HINTS);
  const h=list[state.hintIndex%list.length];
  state.hintIndex++;state.hintUsed++;
  say("Bir ipucu: "+h,"hintmsg");
  setHintReady(false);
  armHintTimer();
});

/* =====================================================================
   ÜST ÇUBUK / İLERLEME
   ===================================================================== */
function updateHud(){
  const t=currentTask();
  $("#levelpill").innerHTML=`${STAGES[t.stage].name}<small>${LEVEL_NAME[t.level]}</small>`;
  $("#starcount").textContent="⭐ "+state.stars;
  const dots=$("#dots");dots.innerHTML="";
  TASKS.forEach((_,i)=>{
    const s=document.createElement("span");
    s.className="dot"+(i<state.completedQuestions?" done":"")+(i===state.currentQuestion?" now":"");
    s.textContent=i<state.completedQuestions?"⭐":(i===state.currentQuestion?"🔎":"☆");
    s.style.filter=i<state.completedQuestions||i===state.currentQuestion?"none":"";
    dots.appendChild(s);
  });
  $("#progtxt").textContent=`Görev ${state.currentQuestion+1} / ${TASKS.length}`;
}

/* =====================================================================
   GÖREV KURULUMU
   ===================================================================== */
function startTask(){
  resetTaskState();
  const t=currentTask();
  state.currentLevel=t.level;
  computeScene();
  updateHud();
  stage.innerHTML="";
  if(t.type==="pickShadow")buildPick(t);
  else buildMissing(t);
  armHintTimer();
}

function card(cap,svg,cls=""){
  const c=document.createElement("div");c.className="card "+cls;
  const h=document.createElement("div");h.className="cap";h.innerHTML=cap;
  c.appendChild(h);c.appendChild(svg);return c;
}

/* ---------- Aşama 2: kayıp parça sahnesi ---------- */
function buildMissing(t){
  const row=document.createElement("div");row.className="scene-row";
  if(t.showObject!==false)row.appendChild(card("🖼️ NESNE",buildObjectSVG(t.objectImage)));
  const shSvg=buildShadowSVG(t.shadowImage);
  const shCard=card("🌑 GÖLGE",shSvg,"shadowcard");
  row.appendChild(shCard);
  stage.appendChild(row);
  const tray=document.createElement("div");tray.className="tray";
  stage.appendChild(tray);
  const pieces=[];
  t.partOptions.forEach((opt,i)=>{
    const b=buildPieceSVG(t,opt,t.shadowImage);
    const slot=document.createElement("div");slot.className="slot";
    const lab=document.createElement("div");lab.className="lab";
    lab.textContent=t.partOptions.length>3?"🧩 "+(i+1):"🧩 PARÇA "+(i+1);
    const cell=document.createElement("div");cell.className="cell";
    const piece=document.createElement("div");piece.className="piece";
    piece.dataset.index=i;
    piece.appendChild(b.svg);
    cell.appendChild(piece);slot.appendChild(lab);slot.appendChild(cell);tray.appendChild(slot);
    pieces.push({el:piece,slot,cell,b,opt,index:i});
  });
  const ctx={task:t,shSvg,shCard,pieces,tray,done:false};
  window._ctx=ctx;
  layoutPieces(ctx);
  pieces.forEach(p=>attachDrag(ctx,p));
  say(t.question,"",isFirstOfStage(t));
}

function layoutPieces(ctx){
  const kk=k();
  let maxH=0;
  ctx.pieces.forEach(p=>{
    const w=p.b.w*kk,h=p.b.h*kk;
    p.b.svg.setAttribute("width",w);p.b.svg.setAttribute("height",h);
    p.el.style.width=w+"px";p.el.style.height=h+"px";
    maxH=Math.max(maxH,h);
  });
  ctx.pieces.forEach(p=>{
    p.cell.style.width=Math.max(p.b.w*kk,60)+"px";
    p.cell.style.height=Math.max(maxH,60)+"px";
  });
}

/* ---------- sürükle-bırak (Pointer Events) ---------- */
function attachDrag(ctx,p){
  const el=p.el;
  let startX=0,startY=0,dx=0,dy=0,active=false,moved=false;
  el.addEventListener("pointerdown",e=>{
    if(ctx.done||state.locked)return;
    e.preventDefault();
    active=true;moved=false;
    startX=e.clientX;startY=e.clientY;dx=dy=0;
    el.setPointerCapture(e.pointerId);
    el.classList.remove("back","shake");el.classList.add("dragging");
    state.selectedPart=p.index;
    sfx.pick();
  });
  el.addEventListener("pointermove",e=>{
    if(!active)return;
    dx=e.clientX-startX;dy=e.clientY-startY;
    if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    el.style.transform=`translate(${dx}px,${dy}px) scale(1.04)`;
  });
  const end=e=>{
    if(!active)return;active=false;
    try{el.releasePointerCapture(e.pointerId)}catch(_){}
    el.classList.remove("dragging");
    if(!moved){el.style.transform="";state.selectedPart=null;
      say("Parçayı gölgedeki boşluğa sürükle.","softmsg");return}
    dropPiece(ctx,p,dx,dy);
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}

function holeScreenCenter(ctx){
  const r=ctx.shSvg.getBoundingClientRect();
  const kk=r.width/200;
  const h=ctx.pieces[0].b;           // boşluk merkezi tüm seçeneklerde aynı
  return {x:r.left+h.hcx*kk,y:r.top+h.hcy*kk,kk};
}
function pieceScreenCenter(p){
  const r=p.el.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function dropPiece(ctx,p,dx,dy){
  const el=p.el;
  const hole=holeScreenCenter(ctx);
  // parçanın (taşınmış hâldeki) merkezi
  const base=pieceScreenCenterBase(p);
  const cur={x:base.x+dx,y:base.y+dy};
  const dist=Math.hypot(cur.x-hole.x,cur.y-hole.y);
  const near=Math.max(70,ctx.shSvg.getBoundingClientRect().width*.32);
  const isCorrect=p.index===ctx.task.correctPart;
  if(dist<near){
    if(isCorrect){
      // hafif mıknatıs: boşluğun tam merkezine yumuşakça otur
      const tx=hole.x-base.x,ty=hole.y-base.y;
      el.classList.add("back");
      // parça merkezi ile boşluk merkezi farkı (parça çizimi kutusu içinde)
      const off=pieceCenterOffset(p,hole.kk);
      el.style.transform=`translate(${tx-off.x}px,${ty-off.y}px) scale(1)`;
      ctx.done=true;state.locked=true;
      setTimeout(()=>onPartPlaced(ctx,p),330);
    }else{
      wrongPiece(ctx,p);
    }
  }else{
    // boşluktan uzakta bırakıldı: sessizce geri dön
    returnPiece(p);
  }
}
/* parça kutusunun merkezi ile boşluk merkezi arasındaki fark */
function pieceCenterOffset(p,kk){
  return {x:(p.b.cx-p.b.hcx)*kk,y:(p.b.cy-p.b.hcy)*kk};
}
function pieceScreenCenterBase(p){
  /* parça, kendi hücresinin tam ortasında durur; geçişten (transition) etkilenmesin diye hücreden ölçülür */
  const r=p.cell.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function returnPiece(p){
  p.el.classList.add("back");
  p.el.style.transform="";
  state.selectedPart=null;
}
function wrongPiece(ctx,p){
  sfx.soft();
  returnPiece(p);
  p.el.classList.add("shake");
  setTimeout(()=>p.el.classList.remove("shake"),420);
  const msgs=["Bir kez daha inceleyelim.","Parçanın biçimine ve yönüne dikkat et.","Daha dikkatli karşılaştırmayı dene.","Yönü tekrar kontrol et."];
  say(msgs[state.attempts%msgs.length],"softmsg");
  noteStruggle();
}
function onPartPlaced(ctx,p){
  fillHole(ctx.shSvg);
  p.el.style.opacity="0";           // parça gölgeye dönüştü
  ctx.shCard.classList.add("glow");
  sfx.snap();setTimeout(sfx.good,120);
  sparkleEl(ctx.shCard,12);
  say("Parça yerine oturdu!","goodmsg");
  ctx.pieces.forEach(q=>{if(q!==p)q.slot.style.opacity=".4"});
  ctx.shCard.querySelector(".cap").innerHTML="✅ GÖLGE TAMAMLANDI";
  setTimeout(()=>say("Gölge tamamlandı!","goodmsg"),1100);
  setTimeout(finishTask,2300);
}

/* =====================================================================
   AŞAMA 1 ve 3 : DOĞRU GÖLGEYİ SEÇ
   ===================================================================== */
function buildPick(t){
  window._ctx=null;
  const row=document.createElement("div");row.className="scene-row";
  const objSvg=buildObjectSVG(t.objectImage,t.objectMirror);objSvg.classList.add("objbig");
  const objCard=card("🖼️ NESNE",objSvg);
  row.appendChild(objCard);stage.appendChild(row);
  const tray=document.createElement("div");tray.className="tray";
  stage.appendChild(tray);
  const ctx={task:t,objCard,slots:[],done:false};
  t.shadowOptions.forEach((def,i)=>{
    const slot=document.createElement("button");slot.type="button";slot.className="slot pickable";
    const lab=document.createElement("div");lab.className="lab";lab.textContent="🌑 GÖLGE "+"ABC"[i];
    slot.appendChild(lab);slot.appendChild(buildShadowSVG(def));
    tray.appendChild(slot);ctx.slots.push(slot);
    slot.addEventListener("click",()=>onPick(ctx,i));
  });
  say(t.question,"",isFirstOfStage(t));
}
function onPick(ctx,i){
  if(ctx.done||state.locked)return;
  const t=ctx.task,slot=ctx.slots[i];
  state.selectedPart=i;
  if(i===t.correctShadow){
    ctx.done=true;state.locked=true;
    sfx.good();
    slot.classList.add("chosen","good");
    ctx.slots.forEach(o=>{if(o!==slot)o.style.opacity=".25"});
    ctx.objCard.classList.add("glow");
    // doğru gölge nesnenin altına doğru hareket eder
    const oc=ctx.objCard.getBoundingClientRect(),sc=slot.getBoundingClientRect();
    slot.style.zIndex=5;
    slot.style.transform=`translate(${oc.left+oc.width/2-(sc.left+sc.width/2)}px,${oc.bottom+8-sc.top}px)`;
    setTimeout(()=>{sparkleEl(slot,12);sfx.star()},700);
    say(["Harika! Doğru gölgeyi buldun!","Çok güzel inceledin!"][t.id%2],"goodmsg");
    setTimeout(finishTask,2100);
  }else{
    sfx.soft();
    slot.classList.add("wrongshake");ctx.objCard.classList.add("wobble");
    setTimeout(()=>{slot.classList.remove("wrongshake");ctx.objCard.classList.remove("wobble")},420);
    const msgs=t.stage===3?["Yöne dikkat et.","Bir kez daha dikkatlice bakalım.","Sağ ve sol tarafları karşılaştır."]
                          :["Bir kez daha dikkatlice incele.","Dış hatlara tekrar bak.","Dış hatları karşılaştırmayı dene."];
    say(msgs[state.attempts%msgs.length],"softmsg");
    noteStruggle();
  }
}

/* =====================================================================
   GÖREV BİTTİ / DÜZEY GEÇİŞİ / OYUN SONU
   ===================================================================== */
function finishTask(){
  const t=currentTask();
  clearTimeout(state.hintReadyTimer);setHintReady(false);
  state.stars++;state.score+=10;state.completedQuestions++;
  $("#starcount").textContent="⭐ "+state.stars;
  sfx.star();
  sparkleEl($("#starcount"),8);
  updateHud();
  const nextIdx=state.currentQuestion+1;
  if(nextIdx>=TASKS.length){showEnd();return}
  if(TASKS[nextIdx].stage!==t.stage){showStageDone(t.stage);return}
  state.currentQuestion=nextIdx;
  startTask();
}
function showStageDone(stageNo){
  $("#level-stars").textContent="⭐".repeat(TASKS.filter(x=>x.stage===stageNo).length);
  $("#level-text").textContent=`${STAGES[stageNo].name} tamamlandı! Şimdi sıradaki aşamaya geçelim: ${STAGES[stageNo+1].name}.`;
  showScreen("screen-level");
  sfx.star();
  speak("Harika! Kaşif rozetini kazandın! Sıradaki aşamaya geçelim.");
  sparkle(window.innerWidth/2,window.innerHeight/3,["🔍","⭐","✨"],14);
}
function showEnd(){
  $("#end-stars").textContent="⭐".repeat(Math.min(state.stars,TASKS.length));
  showScreen("screen-end");
  sfx.star();setTimeout(sfx.good,300);
  speak("Harika bir gölge kaşifi oldun!");
  sparkle(window.innerWidth/2,window.innerHeight/3,["🏆","⭐","🌟","✨"],20);
}

/* =====================================================================
   OLAY BAĞLAMALARI
   ===================================================================== */
$("#btn-start").addEventListener("click",()=>{
  resetAllProgress();
  showScreen("screen-game");
  state.currentQuestion=0;
  startTask();
  speak("Hazırsan gölgeleri keşfetmeye başlayalım! "+Q1);
});
$("#btn-nextlevel").addEventListener("click",()=>{
  state.currentQuestion=state.currentQuestion+1;
  showScreen("screen-game");
  startTask();
  speak(STAGES[currentTask().stage].intro);
});
$("#btn-replay").addEventListener("click",()=>{
  resetAllProgress();
  showScreen("screen-game");
  startTask();
  speak("Hazırsan gölgeleri keşfetmeye başlayalım! "+Q1);
});
$("#btn-menu").addEventListener("click",()=>{resetAllProgress();showScreen("screen-menu")});
$("#btn-home").addEventListener("click",()=>{resetAllProgress();showScreen("screen-menu")});
$("#btn-voice").addEventListener("click",()=>{
  state.voiceOn=!state.voiceOn;
  $("#btn-voice").textContent=state.voiceOn?"🔊":"🔇";
  if(!state.voiceOn)stopSpeech();else speak(msgEl.textContent);
});
$("#btn-repeat").addEventListener("click",()=>{
  const was=state.voiceOn;state.voiceOn=true;speak(msgEl.textContent);state.voiceOn=was;
});
window.addEventListener("resize",()=>{
  if(!$("#screen-game").classList.contains("active"))return;
  computeScene();
  if(window._ctx&&stage.contains(window._ctx.tray))layoutPieces(window._ctx);
});
/* sayfa kaydırma / yakınlaştırma sürüklemeyi bozmasın */
document.addEventListener("touchmove",e=>{
  if($("#screen-game").classList.contains("active"))e.preventDefault();
},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());
</script>
