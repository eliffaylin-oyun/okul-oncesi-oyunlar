<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Görsel Mimarlar</title>
<style>
  :root {
    --bg1: #dff1ff; --bg2: #fff6df;
    --ink: #2b2350; --muted: #6a6592;
    --card: #ffffff; --line: #cfe0f3;
    --sun: #ffd23f; --sun-deep: #f0a81c;
    --mint: #3fc380; --mint-deep: #249a62;
    --coral: #ff7a6b; --sky: #4aa3df; --grape: #8e6cf0;
    --font: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  button:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
  #app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }

  /* ---------- Büyük düğmeler ---------- */
  .btn {
    min-height: 64px; padding: 0 34px; border-radius: 999px;
    font-weight: 800; font-size: clamp(1.2rem, 3.2vmin, 2rem); letter-spacing: .03em;
    color: #fff; background: linear-gradient(var(--mint), var(--mint-deep));
    box-shadow: 0 7px 0 #17724a, 0 12px 22px rgba(30, 90, 60, .25);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #17724a; }
  .btn.sun { color: #4a3300; background: linear-gradient(#ffe27a, var(--sun-deep)); box-shadow: 0 7px 0 #b97a0c, 0 12px 22px rgba(160, 110, 10, .25); }
  .btn.sun:active { box-shadow: 0 2px 0 #b97a0c; }
  .btn.ghost { color: var(--ink); background: #fff; box-shadow: 0 5px 0 var(--line), 0 8px 16px rgba(60, 80, 140, .12); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
  .icon-btn {
    width: clamp(52px, 8vmin, 70px); height: clamp(52px, 8vmin, 70px); border-radius: 50%;
    background: #fff; font-size: clamp(1.3rem, 3.4vmin, 1.9rem);
    box-shadow: 0 5px 0 var(--line), 0 8px 14px rgba(60, 80, 140, .12);
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

  /* ---------- Menü ---------- */
  #menu { align-items: center; justify-content: center; text-align: center; padding: 16px; overflow: auto;
    background:
      radial-gradient(circle at 12% 18%, rgba(255, 210, 63, .35), transparent 38%),
      radial-gradient(circle at 88% 82%, rgba(142, 108, 240, .22), transparent 40%),
      linear-gradient(rgba(74, 163, 223, .10) 1px, transparent 1px) 0 0 / 38px 38px,
      linear-gradient(90deg, rgba(74, 163, 223, .10) 1px, transparent 1px) 0 0 / 38px 38px; }
  .menu-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; display: flex; gap: 10px; }
  .menu-mascot { width: clamp(120px, 24vmin, 240px); animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1.logo { margin: 4px 0 2px; font-size: clamp(2.1rem, 8.6vmin, 5.2rem); line-height: 1.02; letter-spacing: .03em; }
  h1.logo span { display: inline-block; }
  .tag { margin: 0 0 clamp(14px, 3.4vmin, 28px); font-size: clamp(1.05rem, 2.8vmin, 1.7rem); color: var(--muted); }
  .levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: clamp(14px, 3vmin, 26px) 0 6px; }
  .lv {
    width: clamp(52px, 8.4vmin, 74px); height: clamp(52px, 8.4vmin, 74px); border-radius: 18px;
    background: #fff; font-weight: 800; font-size: clamp(1.2rem, 3.2vmin, 1.8rem);
    box-shadow: 0 5px 0 var(--line);
  }
  .lv[aria-pressed="true"] { background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep); }
  .lv-name { min-height: 1.6em; color: var(--muted); font-size: clamp(1rem, 2.4vmin, 1.4rem); margin-bottom: 8px; }
  .shelf { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; max-width: 92vw; }
  .shelf span { width: clamp(38px, 6vmin, 52px); height: clamp(38px, 6vmin, 52px); border-radius: 50%; display: grid; place-items: center;
    background: #fff; font-size: clamp(1.1rem, 2.8vmin, 1.7rem); box-shadow: 0 3px 0 var(--line); opacity: .3; filter: grayscale(1); }
  .shelf span.on { opacity: 1; filter: none; box-shadow: 0 3px 0 var(--sun-deep); background: #fff7d6; }

  /* ---------- Oyun ---------- */
  #game { padding: 0; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: clamp(84px, 14vmin, 120px); }
  #mascotWrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  #gameMascot { width: clamp(64px, 11vmin, 104px); flex: none; }
  #bubble {
    position: relative; flex: 1; min-width: 0; background: #fff; border-radius: 22px; padding: 10px 18px;
    font-size: clamp(1.05rem, 2.7vmin, 1.7rem); font-weight: 700; line-height: 1.25;
    box-shadow: 0 4px 0 var(--line), 0 8px 16px rgba(60, 80, 140, .10);
  }
  #bubble::before { content: ""; position: absolute; left: -10px; top: 50%; width: 20px; height: 20px; background: #fff; transform: translateY(-50%) rotate(45deg); border-radius: 4px; }
  #side { display: flex; align-items: center; gap: 12px; flex: none; }
  #lvTag { padding: 8px 16px; border-radius: 999px; background: #fff; font-weight: 800; font-size: clamp(.9rem, 2.2vmin, 1.25rem); box-shadow: 0 3px 0 var(--line); white-space: nowrap; }
  #dots { display: flex; gap: 8px; }
  .pd { width: clamp(16px, 3vmin, 26px); height: clamp(16px, 3vmin, 26px); border-radius: 50%; border: 3px solid var(--sun-deep); transition: background .3s; }
  .pd.on { background: var(--sun); box-shadow: 0 0 10px rgba(255, 210, 63, .9); }

  #stageWrap { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 0 14px calc(14px); }
  #boardWrap { position: relative; flex: 1; min-width: 0; background: #fff; border-radius: 30px; box-shadow: 0 6px 0 var(--line), 0 14px 30px rgba(60, 80, 140, .14); overflow: hidden; }
  #board { width: 100%; height: 100%; display: block; }
  #tray {
    width: clamp(230px, 30vw, 400px); flex: none; padding: 14px; border-radius: 30px; background: rgba(142, 108, 240, .14);
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: center; justify-content: center; overflow: hidden;
  }
  #tray[hidden] { display: none; }
  .cell { min-width: 0; min-height: 0; aspect-ratio: 1; border-radius: 22px; background: #fff; box-shadow: 0 5px 0 rgba(142, 108, 240, .35); display: grid; place-items: center; position: relative; }
  .cell.empty { background: rgba(255,255,255,.35); box-shadow: none; }
  .piece { width: 100%; height: 100%; display: grid; place-items: center; touch-action: none; cursor: grab; border-radius: 22px; transition: opacity .3s, transform .3s; }
  .piece svg { display: block; overflow: visible; pointer-events: none; }
  .piece.lifted { opacity: .25; }
  .piece.gone { opacity: 0; transform: scale(.6); pointer-events: none; }
  .piece.hint { animation: wiggle .7s ease-in-out 2; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .floater { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; filter: drop-shadow(0 10px 10px rgba(30, 30, 80, .3)); }
  .floater.back { transition: transform .38s cubic-bezier(.3, 1.3, .5, 1); }
  .floater.snap { transition: transform .16s ease-out; }
  .floater svg { display: block; overflow: visible; }

  #thumb { position: absolute; left: 10px; top: 10px; width: clamp(96px, 20%, 190px); aspect-ratio: 1.43; background: #fff;
    border-radius: 18px; box-shadow: 0 4px 0 var(--line), 0 8px 14px rgba(60, 80, 140, .15); border: 3px solid var(--sun); cursor: pointer; padding: 2px;
    transition: transform .3s; transform-origin: top left; }
  #thumb.big { transform: scale(2.3); z-index: 5; }
  #thumb[hidden] { display: none; }
  #thumb svg { width: 100%; height: 100%; display: block; }
  #readyBtn { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; }
  #readyBtn:active { transform: translateX(-50%) translateY(5px); }
  #readyBtn[hidden] { display: none; }

  /* Tahta içindeki parçalar */
  .pg { transition: opacity .5s; }
  .pg.hid { opacity: 0; }
  .pg.pop { animation: pop .5s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 0% { transform: scale(1.18); } 60% { transform: scale(.96); } 100% { transform: scale(1); } }
  .gh { transition: opacity .5s; }
  .gh.off { opacity: 0; }
  .gh.near * { stroke: var(--grape) !important; stroke-width: 4 !important; }
  .gh.glow * { stroke: #ff9f1c !important; stroke-width: 5 !important; animation: glow .9s ease-in-out 4; }
  @keyframes glow { 0%,100% { fill: rgba(255, 210, 63, .1); } 50% { fill: rgba(255, 210, 63, .7); } }
  .gh.shake { animation: shake .4s; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #parts.bounce { animation: bounceModel .6s ease-in-out; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes bounceModel { 0%,100% { transform: scale(1); } 40% { transform: scale(1.025, .98); } 70% { transform: scale(.99, 1.015); } }
  #parts.dance { animation: dance 1.1s ease-in-out 2; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes dance { 0%,100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-3deg) translateY(-8px); } 75% { transform: rotate(3deg) translateY(-8px); } }
  .spark { transform-box: fill-box; transform-origin: center; animation: spark .9s ease-out forwards; }
  @keyframes spark { 0% { transform: translate(0, 0) scale(.2); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }

  .talk .mouth { animation: talk .28s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes talk { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1.1); } }

  /* ---------- Bitiş ve paneller ---------- */
  .overlay { background: rgba(43, 35, 80, .42); align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .card { background: #fff; border-radius: 34px; padding: clamp(18px, 4vmin, 36px); text-align: center; max-width: min(94vw, 560px); max-height: 94%; overflow: auto; box-shadow: 0 14px 40px rgba(30, 30, 80, .3); }
  .card h2 { margin: 6px 0; font-size: clamp(1.5rem, 4.6vmin, 2.6rem); }
  .card p { margin: 6px 0 16px; color: var(--muted); font-size: clamp(1.05rem, 2.6vmin, 1.5rem); }
  .badge-svg { width: clamp(130px, 28vmin, 230px); animation: badge 1s ease-out; }
  @keyframes badge { 0% { transform: scale(.3) rotate(-14deg); opacity: 0; } 70% { transform: scale(1.08) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  .row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 12px 0; text-align: left; font-weight: 700; font-size: 1.15rem; }
  .sw { min-width: 96px; min-height: 52px; border-radius: 999px; background: #e6e4f2; font-weight: 800; }
  .sw[aria-pressed="true"] { background: var(--mint); color: #fff; }
  #banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 25; background: var(--sun); color: #4a3300; padding: 12px 28px; border-radius: 999px;
    font-weight: 800; font-size: clamp(1.2rem, 3.4vmin, 2.2rem); box-shadow: 0 6px 0 var(--sun-deep); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #banner.show { opacity: 1; }
  #confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 22; }
  #confetti i { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  @media (max-aspect-ratio: 6/5) {
    #stageWrap { flex-direction: column; }
    #tray { width: auto; height: clamp(150px, 31vh, 280px); grid-template-columns: repeat(4, minmax(0, 1fr)); align-content: center; padding: 10px; gap: 8px; }
    #bar { gap: 8px; flex-wrap: wrap; min-height: 0; padding: 8px 12px; }
    #homeBtn { order: 1; }
    #side { order: 2; margin-left: auto; }
    #mascotWrap { order: 3; flex: 1 1 100%; }
    #lvTag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<noscript>Bu oyunun çalışması için tarayıcıda JavaScript açık olmalıdır.</noscript>
<div id="app">

  <!-- Başlangıç menüsü -->
  <section id="menu" class="screen">
    <div class="menu-top">
      <button class="icon-btn" id="mSnd" aria-label="Sesi aç veya kapat">🔊</button>
      <button class="icon-btn" id="mFs" aria-label="Tam ekran">⛶</button>
      <button class="icon-btn" id="mSet" aria-label="Ayarlar">⚙️</button>
    </div>
    <div class="menu-mascot" id="menuMascot"></div>
    <h1 class="logo" id="logo" aria-label="Görsel Mimarlar"></h1>
    <p class="tag">Modele bak, parçaları doğru yerlere yerleştir!</p>
    <button class="btn" id="playBtn">▶ OYNA</button>
    <div class="levels" id="levels" role="group" aria-label="Başlangıç seviyesi"></div>
    <div class="lv-name" id="lvName"></div>
    <div class="shelf" id="shelf" aria-label="Rozetlerim"></div>
  </section>

  <!-- Oyun ekranı -->
  <section id="game" class="screen" hidden>
    <header id="bar">
      <button class="icon-btn" id="homeBtn" aria-label="Ana menü">🏠</button>
      <div id="mascotWrap" role="button" tabindex="0" aria-label="Yönergeyi tekrar dinle">
        <div id="gameMascot"></div>
        <div id="bubble" aria-live="polite"></div>
      </div>
      <div id="side">
        <div id="lvTag"></div>
        <div id="dots" aria-label="Yerleştirilen parçalar"></div>
        <button class="icon-btn" id="gSnd" aria-label="Sesi aç veya kapat">🔊</button>
      </div>
    </header>
    <main id="stageWrap">
      <div id="boardWrap">
        <svg id="board" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet" aria-label="Model tahtası"></svg>
        <div id="thumb" hidden role="button" aria-label="Modele tekrar bak"></div>
        <button class="btn" id="readyBtn" hidden>✔ HAZIRIM!</button>
      </div>
      <aside id="tray" hidden aria-label="Parçalar"></aside>
    </main>
  </section>

  <!-- Model bitti -->
  <section id="done" class="screen overlay" hidden role="dialog" aria-modal="true" aria-label="Model tamamlandı">
    <div class="card">
      <div id="badge"></div>
      <h2>Harika bir mimarlık yaptın!</h2>
      <p id="doneMsg">Bütün parçaları doğru yerlerine yerleştirdin!</p>
      <div class="row">
        <button class="btn" id="nextBtn">DEVAM ▶</button>
        <button class="btn ghost" id="doneHome">🏠</button>
      </div>
    </div>
  </section>

  <!-- Ayarlar -->
  <section id="settings" class="screen overlay" hidden role="dialog" aria-modal="true" aria-label="Ayarlar">
    <div class="card" style="width:min(94vw,480px)">
      <h2>Ayarlar</h2>
      <div class="set-row"><span>Ses ve seslendirme</span><button class="sw" id="swSound"></button></div>
      <div class="set-row"><span>Seviye otomatik ilerlesin</span><button class="sw" id="swAuto"></button></div>
      <div class="set-row"><span>Rozetleri ve ilerlemeyi sıfırla</span><button class="sw" id="swReset">Sıfırla</button></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="setClose">TAMAM</button></div>
    </div>
  </section>

  <div id="banner"></div>
  <div id="confetti"></div>
</div>

<script>
(function () {
'use strict';

/* =====================================================================
   GÖRSEL MİMARLAR
   60–72 aylık çocuklar için parça-bütün oyunu.
   Bölümler: Veri (modeller) · Çizim · Ses · Seslendirme · Oyun akışı
   Tüm görseller kod ile çizilir; harici dosya veya internet gerekmez.
   ===================================================================== */

var $ = function (s) { return document.querySelector(s); };
var NS = 'http://www.w3.org/2000/svg';
var VB = { w: 600, h: 420 };

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, f = amt < 0 ? 0 : 255, t = Math.abs(amt);
  return 'rgb(' + Math.round((f - r) * t + r) + ',' + Math.round((f - g) * t + g) + ',' + Math.round((f - b) * t + b) + ')';
}

/* =====================================================================
   MODELLER
   Her model parçalardan oluşur. Çizim sırası arkadan öne doğrudur.
   k: parça anahtarı  c: ana renk  d: parçanın kısa tarifi (ipucu için)
   M1-M3: büyük, birbirinden farklı parçalar
   P1a/P1b: aynı şeklin aynadaki karşılığı (sağ-sol ya da üst-alt)
   P2a/P2b: aynı şekil, farklı renk tonu ve küçük ayrıntı
   D1/D2: küçük ayrıntı parçaları
   Şekil ilkelleri: ['r',x,y,w,h,köşe,renk] ['c',x,y,r,renk] ['e',x,y,rx,ry,renk]
                    ['p',[x,y,...],renk] ['l',x1,y1,x2,y2,renk,kalınlık] ['s',x,y,R,r,renk]
   Renk: boş = parça rengi, 'dk' = koyu ton, 'lt' = açık ton
   Yeni model eklemek için MODEL_DEFS listesine aynı biçimde bir kayıt eklemek yeterlidir.
   ===================================================================== */
var MODEL_DEFS = [
 { id: 'robot', name: 'Robot', emoji: '🤖', at: 300, parts: [
  { k: 'M3', c: '#2f7fb8', d: 'uzun', p: [['r',248,325,40,58,10],['r',312,325,40,58,10],['r',236,372,64,18,9,'dk'],['r',300,372,64,18,9,'dk']] },
  { k: 'P1a', c: '#3b8ec9', d: 'kıvrık', p: [['p',[228,200,200,200,148,236,148,288,178,288,182,254,228,232]]] },
  { k: 'P1b', mir: 'P1a', c: '#3b8ec9' },
  { k: 'P2a', c: '#f39c3d', d: 'ince', p: [['r',224,118,18,42,6]] },
  { k: 'P2b', like: 'P2a', dx: 134, c: '#f7b267', add: [['c',368,139,3.5,'#fff']] },
  { k: 'M1', c: '#4aa3df', d: 'büyük', p: [['r',225,190,150,135,20],['r',250,212,100,52,10,'lt'],['c',272,238,8,'#ffd23f'],['c',300,238,8,'#ff5a5f'],['c',328,238,8,'#5bd67d']] },
  { k: 'M2', c: '#6cc0f0', d: 'köşeli', p: [['r',240,92,120,90,22],['c',276,132,15,'#fff'],['c',324,132,15,'#fff'],['c',280,134,6,'#22305a'],['c',328,134,6,'#22305a'],['r',272,158,56,9,4.5,'dk']] },
  { k: 'D1', c: '#ffd23f', d: 'ince', p: [['l',300,92,300,58,'#a8841c',6],['c',300,50,13]] },
  { k: 'D2', c: '#ffd23f', d: 'sivri', p: [['p',[304,266,291,288,300,288,295,306,311,282,302,282]]] }
 ]},
 { id: 'roket', name: 'Roket', emoji: '🚀', at: 300, parts: [
  { k: 'M3', c: '#ff9f1c', d: 'sivri', p: [['p',[266,285,334,285,316,345,300,392,284,345]],['p',[284,285,316,285,300,338],'#ffe066']] },
  { k: 'P1a', c: '#ff5a5f', d: 'eğik', p: [['p',[246,205,196,265,190,335,246,292]]] },
  { k: 'P1b', mir: 'P1a', c: '#ff5a5f' },
  { k: 'M1', c: '#e9eef7', d: 'uzun yuvarlak', p: [['e',300,170,62,118]] },
  { k: 'M2', c: '#ff5a5f', d: 'üçgen', p: [['p',[300,20,352,98,248,98]]] },
  { k: 'D1', c: '#7a8fa8', d: 'yuvarlak', p: [['c',300,150,25],['c',300,150,17,'#8fd6ff']] },
  { k: 'P2a', c: '#ffd23f', d: 'küçük yuvarlak', p: [['c',266,232,11]] },
  { k: 'P2b', like: 'P2a', dx: 68, c: '#ffe98a', add: [['c',334,232,4,'#fff']] },

  Store.d.level = S.level; Store.save(); renderShelf();
  var parts = $('#parts'); parts.classList.remove('bounce'); void parts.getBoundingClientRect(); parts.classList.add('dance');
  setTimeout(function () { Snd.play('done'); confetti(); Voice.say(LINES.done); }, 500);
  setTimeout(showDone, 2600);
}
function badgeSVG(emoji, stars) {
  var st = '';
  for (var i = 0; i < 3; i++) st += '<polygon points="' + starPts(60 + (i - 1) * 34, 168, 15, 6.5) + '" fill="' + (i < stars ? '#ffd23f' : '#e3e0ee') + '" stroke="' + (i < stars ? '#c9981a' : '#cfcbe2') + '" stroke-width="2.5" stroke-linejoin="round"/>';
  return '<svg class="badge-svg" viewBox="0 0 120 190"><polygon points="38,92 22,150 46,140 60,160 60,100" fill="#ff7a6b" stroke="#c94a3d" stroke-width="3" stroke-linejoin="round"/>' +
    '<polygon points="82,92 98,150 74,140 60,160 60,100" fill="#8e6cf0" stroke="#6a48c8" stroke-width="3" stroke-linejoin="round"/>' +
    '<circle cx="60" cy="62" r="50" fill="#ffd23f" stroke="#c9981a" stroke-width="4"/><circle cx="60" cy="62" r="39" fill="#fff7d6" stroke="#f0a81c" stroke-width="3"/>' +
    '<text x="60" y="78" text-anchor="middle" font-size="42">' + emoji + '</text>' + st + '</svg>';
}
function showDone() {
  $('#badge').innerHTML = badgeSVG(S.model.emoji, S.doneStars);
  $('#doneMsg').textContent = S.leveledUp ? 'Yeni seviyeye geçiyoruz!' : 'Bütün parçaları doğru yerlerine yerleştirdin!';
  show('#done', true); $('#nextBtn').focus();
}
function confetti() {
  var box = $('#confetti'), cols = ['#ffd23f', '#ff7a6b', '#3fc380', '#4aa3df', '#8e6cf0'];
  for (var i = 0; i < 34; i++) {
    var c = document.createElement('i'); c.style.left = rand(0, 100) + '%'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = rand(3.2, 5.6) + 's'; c.style.animationDelay = rand(0, 1.2) + 's'; box.appendChild(c);
  }
  setTimeout(function () { box.innerHTML = ''; }, 7500);
}
function nextFromDone() {
  show('#done', false); $('#confetti').innerHTML = '';
  var up = S.leveledUp; var lvl = S.level;
  loadModel(false);
  if (up) {
    var b = $('#banner'); b.textContent = 'Seviye ' + lvl + ' · ' + LEVELS[lvl - 1].name; b.classList.add('show'); setTimeout(function () { b.classList.remove('show'); }, 3000);
    Voice.say('Harika! Artık ' + LEVELS[lvl - 1].name + ' oldun!');
    setTimeout(function () { if (S.phase === 'preview') Voice.say(Voice.pool('preview', LINES.preview)); }, 3400);
  }
}
function goHome() {
  clearIdle(); Voice.stop(); S.phase = 'menu'; S.drag = null;
  var fl = document.querySelectorAll('.floater'); for (var i = 0; i < fl.length; i++) fl[i].parentNode.removeChild(fl[i]);
  $('#confetti').innerHTML = ''; show('#done', false); show('#game', false); show('#menu', true); renderLevels(); renderShelf();
}

/* ---------- Düğmeler ---------- */
function toggleSound() {
  Store.d.sound = !Store.d.sound; Store.save(); syncSoundBtns(); Snd.init();
  if (!Store.d.sound) Voice.stop(true);
}
function toggleFS() {
  var d = document, root = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { var f = root.requestFullscreen || root.webkitRequestFullscreen; if (f) { var p = f.call(root); if (p && p.catch) p.catch(function () {}); } }
  } catch (e) {}
}
function openSettings() { syncSettings(); show('#settings', true); $('#setClose').focus(); }
function syncSettings() {
  var a = $('#swSound'), b = $('#swAuto');
  a.textContent = Store.d.sound ? 'Açık' : 'Kapalı'; a.setAttribute('aria-pressed', String(Store.d.sound));
  b.textContent = Store.d.auto ? 'Açık' : 'Kapalı'; b.setAttribute('aria-pressed', String(Store.d.auto));
}

$('#playBtn').addEventListener('click', startGame);
$('#readyBtn').addEventListener('click', toBuild);
$('#nextBtn').addEventListener('click', nextFromDone);
$('#doneHome').addEventListener('click', goHome);
$('#homeBtn').addEventListener('click', goHome);
$('#mSnd').addEventListener('click', toggleSound);
$('#gSnd').addEventListener('click', toggleSound);
$('#mFs').addEventListener('click', toggleFS);
$('#mSet').addEventListener('click', openSettings);
$('#setClose').addEventListener('click', function () { show('#settings', false); });
$('#swSound').addEventListener('click', function () { toggleSound(); syncSettings(); });
$('#swAuto').addEventListener('click', function () { Store.d.auto = !Store.d.auto; Store.save(); syncSettings(); });
$('#swReset').addEventListener('click', function () {
  if (window.confirm('Rozetler ve ilerleme sıfırlansın mı?')) { Store.d.level = 1; Store.d.badges = {}; Store.save(); renderLevels(); renderShelf(); }
});
$('#mascotWrap').addEventListener('click', function () {
  if (S.phase === 'preview') Voice.say(Voice.pool('preview', LINES.preview));
  else if (S.phase === 'build') Voice.say(Voice.pool('build', LINES.build));
});
$('#thumb').addEventListener('click', function () {
  var t = $('#thumb'); t.classList.add('big'); Voice.say(LINES.thumb); resetIdle();
  setTimeout(function () { t.classList.remove('big'); }, 3200);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') show('#settings', false); });
window.addEventListener('resize', function () { sizeTray(); });
window.addEventListener('error', function (e) { try { e.preventDefault(); } catch (x) {} });
document.addEventListener('visibilitychange', function () { if (document.hidden) Voice.stop(true); });
try { if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = function () {}; } } catch (e) {}
document.addEventListener('contextmenu', function (e) { if (S.phase === 'build') e.preventDefault(); });

/* ---------- Başlat ---------- */
Store.load(); S.level = Store.d.level; syncSoundBtns(); buildMenu();
if (window.__GM_TEST) window.__GM = { MODELS: MODELS, S: S, LEVELS: LEVELS, geom: geom, loadModel: loadModel, startGame: startGame, renderBoard: renderBoard, partMarkup: partMarkup, fullModelMarkup: fullModelMarkup, Store: Store };

})();
</script>
</body>
</html>
