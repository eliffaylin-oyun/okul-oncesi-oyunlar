<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Okul Öncesi Oyunlar</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#33425e;
  background:linear-gradient(160deg,#fff4c9,#d8f1ff 55%,#e6ffe0);padding:5vmin 4vmin}
header{text-align:center;margin-bottom:5vmin}
h1{margin:0 0 1.5vmin;font-size:clamp(34px,7vmin,70px)}
header p{margin:0;font-size:clamp(18px,3vmin,28px);font-weight:700}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:3vmin;max-width:1200px;margin:0 auto}
a.card{display:flex;flex-direction:column;align-items:center;gap:1.5vmin;text-decoration:none;color:inherit;background:#fff;
  border-radius:36px;padding:4vmin 3vmin;box-shadow:0 8px 0 rgba(0,0,0,.12);transition:transform .15s;text-align:center}
a.card:active,a.card:hover{transform:translateY(-4px) scale(1.02)}
.ic{font-size:clamp(70px,14vmin,130px);line-height:1}
.nm{font-size:clamp(24px,4.4vmin,40px);font-weight:800}
.ds{font-size:clamp(16px,2.6vmin,22px);font-weight:600;opacity:.85}
.c1{background:#ffe3e3}.c2{background:#e1f5d9}.c3{background:#d9ecff}
footer{text-align:center;margin-top:5vmin;font-size:15px;font-weight:600;opacity:.7}
</style>
</head>
<body>
<header>
  <h1>🎈 Okul Öncesi Oyunlar</h1>
  <p>Bir oyun seç ve oynamaya başla!</p>
</header>
<main>
  <a class="card c1" href="oyunlar/kasif-treni.html">
    <span class="ic">🚂</span>
    <span class="nm">Minik Kaşif Treni</span>
    <span class="ds">Benzer, aynı, canlı: ortak özelliği bul</span>
  </a>
  <a class="card c2" href="oyunlar/sihirli-ayna.html">
    <span class="ic">🪞</span>
    <span class="nm">Sihirli Ayna İkizleri</span>
    <span class="ds">Aynı, farklı, konum: eksik parçayı yerine koy</span>
  </a>
  <a class="card c3" href="oyunlar/minik-dedektifler.html">
    <span class="ic">🔍</span>
    <span class="nm">Minik Dedektifler</span>
    <span class="ds">Aynı, farklı, benzer, canlı, konum, ipucu</span>
  </a>
</main>
<footer>Reklamsız, veri toplamayan eğitsel oyunlar</footer>
</body>
</html>
